# See https://docs.codecov.com/docs/codecovyml-reference for details

# Coverage is uploaded from two Julia versions (lts + latest); wait for both so
# version-gated code is judged on the union, not a single version.
codecov:
  notify:
    after_n_builds: 2

comment:
  after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: 90%
    patch:
      default:
        target: 90%
  range: "80...90" # Yellow within this range
