name: Test on PRs

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "*.toml"
    types: [opened, synchronize, reopened]

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Test both the LTS (currently 1.10) and the latest release, so
        # version-gated code paths (e.g. the Julia 1.11+ Base.Lockable backing of
        # ThreadSafe) are exercised and reported to Codecov on every PR.
        version: ["lts", "1"]
    uses: ./.github/workflows/ReusableTest.yml
    with:
      os: ubuntu-latest
      version: ${{ matrix.version }}
      arch: x64
      allow_failure: false
      run_codecov: true
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
