name: Lint

on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:

  lint:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      - name: Build package (required for ExplicitImports)
        uses: julia-actions/julia-buildpkg@v1
      - name: Install ExplicitImports
        # The ExplicitImports hook is `language: script` and loads the package
        # from the default environment. (The Runic hook is `language: julia`, so
        # prek provisions Runic itself.)
        run: julia -e 'using Pkg; pkg"add ExplicitImports"'
      - name: Install prek
        # Standalone installer (no Python); it adds itself to $GITHUB_PATH.
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/j178/prek/releases/latest/download/prek-installer.sh | sh
      - name: Run prek
        run: SKIP=no-commit-to-branch prek run --all-files

  link-checker:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --config '.lychee.toml' .
